name: Build and check the combined OldPhilly site
description: Preserve the photo build and install the checked static menu app under /menus/.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: "3.12"
    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen
    - name: Check the photo project
      shell: bash
      run: |
        uv run --frozen ruff check .
        uv run --frozen ty check
        uv run --frozen pytest -q
    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.19.0
        cache: npm
        cache-dependency-path: menus/package-lock.json
    - name: Install menu dependencies
      shell: bash
      working-directory: menus
      run: npm ci --ignore-scripts
    - name: Check the menu app
      shell: bash
      working-directory: menus
      env:
        ASTRO_TELEMETRY_DISABLED: "1"
      run: npm run check
    - name: Download existing photo metadata
      shell: bash
      run: |
        curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
          "https://huggingface.co/datasets/h0rv/phillyhistory-metadata/resolve/main/source_records.parquet" \
          -o /tmp/source_records.parquet
    - name: Generate existing photo data
      shell: bash
      run: uv run --frozen python scripts/generate_site_data.py --from-hf /tmp/source_records.parquet
    - name: Install menus into the existing site
      shell: bash
      working-directory: menus
      env:
        ASTRO_TELEMETRY_DISABLED: "1"
      run: npm run build:site
    - name: Install the browser
      shell: bash
      working-directory: menus
      run: npx playwright install --with-deps chromium
    - name: Check photo and menu routes together
      shell: bash
      working-directory: menus
      env:
        ASTRO_TELEMETRY_DISABLED: "1"
      run: npm run test:browser
